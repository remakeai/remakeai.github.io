        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.3s ease-out;
        }

        #page-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #page-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #ccd0d5;
            border-top-color: #1877f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #page-loader .loading-text {
            margin-top: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #65676b;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .facebook-ad-post {

            line-height: 1.34;
            position: relative;
        }

        .ad-post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            height: 40px;
            border-radius: 50%;
            background: #e4e6eb;
            overflow: hidden;

            height: 100%;

        .ad-page-name {

            font-weight: 600;
            color: #050505;

        }

        .ad-metadata {

            color: #65676b;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sponsored-label {
            font-weight: 600;
        }

        .ad-globe-icon {
            width: 13px;
            height: 13px;
            display: inline-block;
            vertical-align: middle;
            margin-top: -2px;
        }

        .ad-header-buttons {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .ad-header-button {
            padding: 4px 8px;
            background: none;
            border: none;
            color: #65676b;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad-header-button:hover {
            background: #f0f2f5;
        }

        .ad-post-text {

            font-size: 15px;
            color: #050505;
            line-height: 1.3333;
            white-space: pre-wrap;
        }

        .ad-see-more {
            color: #65676b;
            font-weight: 600;
            cursor: pointer;
        }

        .ad-see-more:hover {
            text-decoration: underline;
        }

        .ad-image-container {
            width: 100%;
            max-height: 57vh;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ad-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .ad-image-container video {
            width: 100%;
            max-height: 56.9vh;
            object-fit: contain;
            display: block;
        }

            display: flex;
            flex-direction: column;
            position: relative;

            color: #65676b;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .ad-link-headline {
            font-size: 16px;
            font-weight: 600;
            color: #050505;
            line-height: 1.2;
            padding-right: 120px;
        }

        .ad-call-to-action-button {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: #e4e6eb;
            color: #050505;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .ad-call-to-action-button:hover {

        }

        .ad-engagement-bar {

            border-top: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .ad-engagement-counts {

            gap: 4px;

        .ad-action-buttons {

            background: #f0f2f5;

        .ad-action-icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

    <script>
        var video = document.querySelector('video');
        var loader = document.getElementById('page-loader');

        function hideLoader() {
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(function() { loader.remove(); }, 300);
            }
        }

        if (video) {
            video.addEventListener('canplaythrough', hideLoader);
            // Fallback in case video is already loaded
            if (video.readyState >= 4) {
                hideLoader();
            }
        } else {
            // No video, hide on window load
            window.addEventListener('load', hideLoader);
        }
    </script>
