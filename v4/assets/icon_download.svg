<svg width="28" height="28" viewBox="0 0 680 560" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Phone outline -->
  <rect x="220" y="60" width="240" height="400" rx="32" stroke="#ff4e1f" stroke-width="16"/>

  <!-- Phone inner screen bezel -->
  <rect x="242" y="100" width="196" height="320" rx="14" stroke="#ff4e1f" stroke-width="6" opacity="0.35"/>

  <!-- Top speaker notch -->
  <rect x="300" y="76" width="80" height="10" rx="5" stroke="#ff4e1f" stroke-width="5" opacity="0.5"/>

  <!-- Front camera dot -->
  <circle cx="402" cy="81" r="5" fill="#ff4e1f" opacity="0.5"/>

  <!-- Bottom home bar -->
  <rect x="300" y="436" width="80" height="8" rx="4" fill="#ff4e1f" opacity="0.4"/>

  <!-- Side buttons left -->
  <rect x="210" y="160" width="10" height="38" rx="5" stroke="#ff4e1f" stroke-width="6" opacity="0.4"/>
  <rect x="210" y="210" width="10" height="38" rx="5" stroke="#ff4e1f" stroke-width="6" opacity="0.4"/>

  <!-- Side button right -->
  <rect x="460" y="175" width="10" height="52" rx="5" stroke="#ff4e1f" stroke-width="6" opacity="0.4"/>

  <!-- Download arrow — vertical shaft -->
  <line x1="340" y1="160" x2="340" y2="310" stroke="#ff4e1f" stroke-width="18" stroke-linecap="round"/>

  <!-- Arrow head -->
  <polyline points="280,268 340,338 400,268" stroke="#ff4e1f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base tray line -->
  <line x1="272" y1="358" x2="408" y2="358" stroke="#ff4e1f" stroke-width="14" stroke-linecap="round"/>

  <!-- Progress bar below tray -->
  <rect x="272" y="376" width="136" height="10" rx="5" stroke="#ff4e1f" stroke-width="5" opacity="0.3"/>
  <!-- Filled portion -->
  <rect x="272" y="376" width="90" height="10" rx="5" fill="#ff4e1f" opacity="0.5"/>

</svg>
